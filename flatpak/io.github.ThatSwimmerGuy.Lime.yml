# Builds Lime from this checkout, for testing:
#   flatpak run org.flatpak.Builder --user --install --force-clean build-dir flatpak/io.github.ThatSwimmerGuy.Lime.yml
id: io.github.ThatSwimmerGuy.Lime
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: lime
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # BlueZ: list paired phones (system bus) and talk to the iPhone over MAP/PBAP (obexd, session bus)
  - --system-talk-name=org.bluez
  - --talk-name=org.bluez.obex
# Autocorrect and spell check use Enchant and the Hunspell dictionaries that the GNOME runtime
# already ships, so no extra module is needed for them.
modules:
  - name: lime
    buildsystem: simple
    build-commands:
      - install -Dm644 -t /app/share/lime/phonemessages phonemessages/*.py
      - install -Dm755 flatpak/lime.sh /app/bin/lime
      - install -Dm644 -t /app/share/applications data/io.github.ThatSwimmerGuy.Lime.desktop
      - install -Dm644 -t /app/share/metainfo data/io.github.ThatSwimmerGuy.Lime.metainfo.xml
      - install -Dm644 icons/lime.svg /app/share/icons/hicolor/scalable/apps/io.github.ThatSwimmerGuy.Lime.svg
    sources:
      - type: dir
        path: ..
        skip:
          - build-dir
          - .flatpak-builder
